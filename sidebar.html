 const params=new URLSearchParams(location.search);let plant=params.get('plant')||'';let token=params.get('token')||sessionStorage.getItem('vs_token')||localStorage.getItem('vs_token')||'';

 document.querySelectorAll('#sidebarNav a').forEach(a=>{const href=a.getAttribute('href');a.setAttribute('href',href+'?plant='+encodeURIComponent(plant)+'&token='+encodeURIComponent(token));const page=a.dataset.page,cur=location.pathname.split('/').pop()||'home.php';if(page===cur){a.classList.add('!bg-emerald-50','!text-emerald-700','!border-emerald-500');}});

})();
